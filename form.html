
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Product review form for submitting feedback about products.">
    <meta name="author" content="Stanley Ihimjekwe">
    <title>Product Review</title>
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>

<body>
    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form method="get" action="review.html">

            <p class="required-note">
                <span class="required">*</span> Required field
            </p>

            <label for="product">
                Product Name <span class="required">*</span>
            </label>

            <select id="product" name="product" required>
                <option value="" disabled selected>Select a Product ...</option>
            </select>

            <fieldset>
                <legend>
                    Overall Rating <span class="required">*</span>
                </legend>

                <div class="rating">
                    <label for="rating1">1 ☆</label>
                    <input type="radio"
                           id="rating1"
                           name="rating"
                           value="1"
                           required>

                    <label for="rating2">2 ☆☆</label>
                    <input type="radio"
                           id="rating2"
                           name="rating"
                           value="2"
                           required>

                    <label for="rating3">3 ☆☆☆</label>
                    <input type="radio"
                           id="rating3"
                           name="rating"
                           value="3"
                           required>

                    <label for="rating4">4 ☆☆☆☆</label>
                    <input type="radio"
                           id="rating4"
                           name="rating"
                           value="4"
                           required>

                    <label for="rating5">5 ☆☆☆☆☆</label>
                    <input type="radio"
                           id="rating5"
                           name="rating"
                           value="5"
                           required>
                </div>
            </fieldset>

            <label for="installDate">
                Date of Installation <span class="required">*</span>
            </label>

            <input type="date"
                   id="installDate"
                   name="installDate"
                   required>

            <fieldset>
                <legend>Useful Features</legend>

                <label for="durability">
                    <input type="checkbox"
                           id="durability"
                           name="features"
                           value="durability">
                    Durability
                </label>

                <label for="ease">
                    <input type="checkbox"
                           id="ease"
                           name="features"
                           value="ease">
                    Ease of Use
                </label>

                <label for="performance">
                    <input type="checkbox"
                           id="performance"
                           name="features"
                           value="performance">
                    Performance
                </label>

                <label for="design">
                    <input type="checkbox"
                           id="design"
                           name="features"
                           value="design">
                    Design
                </label>
            </fieldset>

            <label for="review">
                Written Review <span>(Optional)</span>
            </label>

            <textarea id="review"
                      name="review"
                      rows="6"></textarea>

            <label for="username">
                Your Name <span>(Optional)</span>
            </label>

            <input type="text"
                   id="username"
                   name="username">

            <input type="submit" value="Post Review">
        </form>
    </main>

    <footer>
        <p>&copy; 2026 | Product Review | Stanley Ihimjekwe</p>
    </footer>
</body>
</html>
